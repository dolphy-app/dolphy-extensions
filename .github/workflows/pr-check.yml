name: PR check

on:
  pull_request:
    paths:
      - 'extensions/**'
      - 'revoked.json'
      - 'scripts/**'
      - '.github/workflows/pr-check.yml'

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # опубликованный индекс: нужен правилу «версия больше опубликованной»
  INDEX_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.json

jobs:
  detect:
    name: Changed extensions
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.detect.outputs.extensions }}
      revoked: ${{ steps.detect.outputs.revoked }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect
        id: detect
        run: scripts/changed-extensions.sh "origin/${{ github.base_ref }}...HEAD" >> "$GITHUB_OUTPUT"

  check:
    name: Check and build (${{ matrix.extension }})
    needs: detect
    if: needs.detect.outputs.extensions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJson(needs.detect.outputs.extensions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # инструменты каталога (dolphy-ext)
      - name: Install tools
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Fetch published index
        run: |
          if curl -fsSL "$INDEX_URL" -o published.json; then
            echo "published index: $(wc -c < published.json) bytes"
          else
            echo 'no published index yet (first publication)'
            rm -f published.json
          fi

      - name: Check
        run: |
          args=(--ids "${{ matrix.extension }}")
          [ -f published.json ] && args+=(--published-index published.json)
          npx dolphy-ext catalog check extensions "${args[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # зависимости проекта расширения: без скриптов пакетов
      - name: Install extension dependencies
        working-directory: extensions/${{ matrix.extension }}
        run: |
          if node -e "const p=require('./package.json');process.exit(Object.keys({...p.dependencies,...p.devDependencies}).length?0:1)"; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            echo 'no dependencies'
          fi

      - name: Build
        run: npx dolphy-ext catalog build --src extensions --ids "${{ matrix.extension }}" --out site

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.extension }}
          path: site/extensions/${{ matrix.extension }}
          retention-days: 7

  revoked:
    name: Check revoked.json
    needs: detect
    if: needs.detect.outputs.revoked == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install tools
        run: npm install --ignore-scripts --no-audit --no-fund

      # пробная пересборка индекса с новым списком отзыва: неверный диапазон версии даст ошибку
      - name: Reindex (dry)
        run: |
          mkdir site
          curl -fsSL "$INDEX_URL" -o site/index.json
          npx dolphy-ext catalog build --reindex --out site --revoked revoked.json
