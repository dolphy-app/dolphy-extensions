name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'revoked.json'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: read

# публикации идут строго по очереди: каждая дописывает ветку gh-pages
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  detect:
    name: Changed extensions
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.detect.outputs.extensions }}
      revoked: ${{ steps.detect.outputs.revoked }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect
        id: detect
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = '0000000000000000000000000000000000000000' ]; then
            before=$(git rev-list --max-parents=0 HEAD)
          fi
          scripts/changed-extensions.sh "$before...HEAD" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: detect
    if: needs.detect.outputs.extensions != '[]' || needs.detect.outputs.revoked == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      IDS: ${{ join(fromJson(needs.detect.outputs.extensions), ',') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@spirula-app'

      - name: Install tools
        run: npm install --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ветка gh-pages — то, что отдаёт GitHub Pages; нет ветки — первая публикация
      - name: Prepare site
        run: |
          remote="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --quiet --branch gh-pages --single-branch "$remote" site
          else
            git init --quiet --initial-branch gh-pages site
            git -C site remote add origin "$remote"
          fi

      - name: Install extension dependencies
        if: env.IDS != ''
        run: |
          for id in ${IDS//,/ }; do
            dir="extensions/$id"
            if node -e "const p=require('./$dir/package.json');process.exit(Object.keys({...p.dependencies,...p.devDependencies}).length?0:1)"; then
              (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: |
          if [ -n "$IDS" ]; then
            npx spirula-ext catalog build --src extensions --ids "$IDS" --out site --revoked revoked.json
          else
            npx spirula-ext catalog build --reindex --out site --revoked revoked.json
          fi
          touch site/.nojekyll

      - name: Commit and push
        working-directory: site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to publish'
            exit 0
          fi
          git commit --quiet -m "publish: ${IDS:-revoked.json} (${GITHUB_SHA::7})"
          git push origin HEAD:gh-pages
